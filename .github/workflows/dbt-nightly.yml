name: dbt nightly

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

concurrency:
  group: dbt-nightly
  cancel-in-progress: false

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      - name: Source freshness and build
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          eval "$(python dbt/env_from_url.py NEON_DATABASE_URL)"
          cd dbt
          dbt source freshness --profiles-dir .
          dbt build --profiles-dir .