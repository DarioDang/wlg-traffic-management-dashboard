version: 2

models:
  - name: stg_event_versions
    columns:
      - name: version_id
        data_tests: [unique, not_null]
      - name: event_id
        data_tests: [not_null]
      - name: impact
        data_tests:
          - accepted_values:
              arguments:
                values: ["Caution", "Delays", "Road Closed"]
              config:
                severity: warn
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["Area Warning", "Road Work", "Scheduled Road Work", "Road Hazard"]
              config:
                severity: warn

  - name: stg_events_current
    columns:
      - name: event_id
        data_tests: [unique, not_null]